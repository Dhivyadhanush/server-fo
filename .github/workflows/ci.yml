name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Build
        run: ARCHS="arm64 x86_64" ./build.sh

      - name: Self test
        run: ./.build/Server-Fo.app/Contents/MacOS/ServerInfo --selftest

      - name: Verify signature
        run: codesign --verify --deep --strict --verbose=2 .build/Server-Fo.app
